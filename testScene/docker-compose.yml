# https://hub.docker.com/r/dockurr/windows

services:
  windows:
    image: dockurr/windows
    container_name: windows
    environment:
      VERSION: "11"
      USERNAME: "root"
      PASSWORD: "root"
      REGION: "fr-FR"
      KEYBOARD: "fr-FR"
      HOST_PORT: 5136
    devices:
      - /dev/kvm
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
      - 3389:3389/tcp
      - 3389:3389/udp
    stop_grace_period: 2m
    volumes:
      - ../dist/zxp:/data
      - ./custom-install:/oem

